# 使用前修改：
#   1. /home/xdc → 你的主目录
#   2. /run/user/1000 里的 1000 → 你的 UID
#   3. group_add 里 992/44 → `getent group render video` 的实际 GID
#   4. 代理端口 7890 → 你的实际值，不用代理可整段删除
#   5. WAYLAND_DISPLAY → `echo $WAYLAND_DISPLAY`；X11 用户删这行并把
#      SDL_VIDEODRIVER 改成 x11
services:
  tmodloader:
    build:
      context: .
      args:
        UID: ${HOST_UID}
        GID: ${HOST_GID}
    image: tmodloader-calamity:1.4.4
    container_name: tmodloader
    user: "${HOST_UID}:${HOST_GID}"
    environment:
      # 显示
      - DISPLAY=${DISPLAY}
      - WAYLAND_DISPLAY=wayland-1
      - XDG_RUNTIME_DIR=/run/user/1000
      - SDL_VIDEODRIVER=wayland
      - HOME=/data
      - XAUTHORITY=/data/.Xauthority
      # 音频
      - PULSE_SERVER=unix:/run/user/1000/pulse/native
      # 代理（Clash Verge Rev 混合端口）
      - http_proxy=http://127.0.0.1:7890
      - https_proxy=http://127.0.0.1:7890
      - all_proxy=socks5://127.0.0.1:7890
      - HTTP_PROXY=http://127.0.0.1:7890
      - HTTPS_PROXY=http://127.0.0.1:7890
      - ALL_PROXY=socks5://127.0.0.1:7890
      - no_proxy=localhost,127.0.0.1,::1
      - NO_PROXY=localhost,127.0.0.1,::1
    security_opt:
      - apparmor:unconfined
      - seccomp:unconfined
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "992"      # render
      - "44"       # video
    volumes:
      # X11 socket（Wayland 环境也挂，供 SDL 回退）
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # Wayland socket + PulseAudio（整个 runtime 目录）
      - /run/user/1000:/run/user/1000
      # X11 认证文件（Wayland 环境可删）
      - /home/xdc/.Xauthority:/data/.Xauthority:ro
      # GOG 版 Terraria（只读挂载）
      - /home/xdc/Documents/Calamity/Terraria/game:/opt/terraria-gog:ro
      # tModLoader 本体（宿主机目录，挂载进来，不再打进镜像）
      - ./tmodloader:/opt/tmod
      # 持久化数据（存档、Content 副本）
      - ./data:/data
      # .NET 运行时缓存（叠加在 /opt/tmod 之上）
      - ./dotnet:/opt/tmod/dotnet
      # 日志（叠加在 /opt/tmod 之上）
      - ./logs:/opt/tmod/tModLoader-Logs
    working_dir: /opt/tmod
    network_mode: host
    stdin_open: true
    tty: true
